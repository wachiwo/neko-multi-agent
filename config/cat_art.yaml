# cat_art.yaml — Seasonal ASCII Art Catalog (Complete)
# Part A (Jan-Jun + specials): Designed by Worker3 (3号猫)
# Part B (Jul-Dec + specials + achievements): Designed by Worker4 (4号猫), Fixed by Worker1 (1号猫)
# Merged by: Worker3 (3号猫) — merge_021_002
#
# Structure: month -> stage_species -> multiline ASCII art (5-8 lines)
# Stages: kitten (C rank), cat (B/A rank), lion (S/SS rank)
# Species: cat (W1/W3/W4), dog (W2)
# Final line of each art: seasonal greeting
# Width: ~25 chars max per line
# Note: |2 indicator = content indent is 4 spaces (key_indent 2 + 2)

_metadata:
  version: "1.1-fixed"
  description: "Seasonal ASCII Art Catalog for neko-multi-agent"
  loading_note: "Load ONLY current month section to minimize token usage"
  structure: "month -> {theme, image_description, stage_species: art}"
  stages:
    kitten: "C rank"
    cat: "B/A rank"
    lion: "S/SS rank"
  species:
    cat: "W1, W3, W4"
    dog: "W2"
  special_day_priority: "achievement > date_special > monthly"
  eye_convention:
    cat: "・ω・"
    dog: "^w^"
    kitten: "o.o / owo"
  format_standard: "|2 block scalar (matches W3 Jan-Jun catalog)"

