# ============================================================================
# SECTION 4: FEATURE 3 — EVOLUTION ART (進化アート)
# ============================================================================
# 3 evolution stages. Seasonal art applies as a MODIFIER to the evolution stage.
# Art templates stored in config/cat_art.yaml (the art catalog).
# Art catalog keys: {stage}_{species} e.g., kitten_cat, cat_dog, lion_cat

evolution_art:
  stages:
    stage_1:
      name: "kitten"
      name_ja: "子猫"
      applicable_ranks: ["C"]
      art_catalog_key: "kitten"
      description: "Small, cute kitten art. Minimal detail. 3-4 lines."
    stage_2:
      name: "cat"
      name_ja: "猫"
      applicable_ranks: ["B", "A"]
      art_catalog_key: "cat"
      description: "Full adult cat. Standard neko art with body. 5-6 lines."
    stage_3:
      name: "lion"
      name_ja: "獅子"
      applicable_ranks: ["S", "SS"]
      art_catalog_key: "lion"
      description: "Majestic lion. Largest art. 6-7 lines. Earned through excellence."

  species_suffix:
    cat: "_cat"
    dog: "_dog"

  personality_eyes:
    worker1: "◕ᴗ◕"
    worker2: "◕ω◕"
    worker3: "=.="
    worker4: "-.-"


