# ============================================================================
# SECTION 11: FEATURE 10 — CRITICAL HIT (会心の一撃)
# ============================================================================

feature_10_critical_hit:
  name: "会心の一撃 (Critical Hit)"

  detection:
    trigger: "Cross-review phase where 2+ workers review overlapping targets"
    method: |
      Kashira compares findings across all reviewers for the same cmd:
      1. Collect all findings from all cross-review reports
      2. Match findings by file + approximate line range (+/- 10 lines)
      3. Any HIGH-severity finding that appears in exactly 1 worker's report = Critical Hit candidate
      4. Kashira validates: is this a genuine unique insight or a false positive?
      5. If validated: announce Critical Hit
    auto_detectable: true
    manual_override: "Kashira can award Critical Hit for exceptional findings even outside cross-review"

  reward:
    churu_bonus: 3
    announcement_format: |
      ╔═══════════════════════════════════════╗
      ║   ★ 会心の一撃 ★ CRITICAL HIT ★      ║
      ║   {worker_name} found a bug           ║
      ║   nobody else caught!                 ║
      ║                                       ║
      ║   Finding: {finding_id} ({severity})  ║
      ║   File: {file}:{line}                 ║
      ║   +{bonus} bonus churu                ║
      ╚═══════════════════════════════════════╝
    dashboard_log: true

  streak:
    double_critical_threshold: 2
    double_critical_bonus: 2
    max_streak_bonus: 5

  anti_gaming:
    - "Findings must be HIGH or MEDIUM severity (LOW findings don't qualify)"
    - "Kashira validates uniqueness — paraphrased duplicates don't count"
    - "Maximum 1 Critical Hit per cross-review phase (prevents splitting findings for multiple hits)"


# ============================================================================
# SECTION 12: FEATURE 11 — RIVALRY SYSTEM (ライバル制)
# ============================================================================

feature_11_rivalry:
  name: "ライバル制 (Rivalry System)"

  pairing:
    method: "random_shuffle"
    shuffle_frequency: "quarterly"
    shuffle_trigger: "First day of tournament month (Mar, Jun, Sep, Dec)"
    algorithm: |
      1. List all active workers: [W1, W2, W3, W4]
      2. Seed = quarter_number (e.g., 2026Q1=1, 2026Q2=2)
      3. Fisher-Yates shuffle with deterministic seed
      4. Pair sequentially: shuffled[0]<->shuffled[1], shuffled[2]<->shuffled[3]
      5. If odd number of workers: last worker gets "free agent" status (no rival)
    initial_pairing:
      pair_1: ["worker1", "worker4"]
      pair_2: ["worker2", "worker3"]

  metrics:
    tracked_per_pair:
      - "cross_review_findings_given"
      - "cross_review_findings_received"
      - "quality_comparison"
      - "speed_comparison"
      - "pattern_discoveries"
    scoring: |
      Each metric: +1 point to the leader per week.
      Ties: +0.5 each. Weekly tally in dashboard.
      Monthly winner: +3 bonus churu + "月間ライバル勝者" badge.

  cross_review_interaction:
    rule: "Rivals review each other's work ~50% of the time (when cross-review is assigned)"
    kashira_behavior: |
      When assigning cross-review, kashira uses 50% PREFERENCE for rival pairs:
      - ~Half of cross-review assignments pair rivals together
      - ~Half pair non-rivals for fresh perspective and blind-spot coverage
      - Kashira tracks rival_review_count to maintain approximate 50/50 balance
      - Load balancing always takes priority over rivalry preference
    rivalry_review_bonus: 0.5
    rationale: "50/50 balance preserves rivalry excitement while preventing familiarity bias"

  dashboard_display: |
    ### ⚔️ ライバルボード (Q1 2026)
    | Pair | W-L-D | Latest | Leader |
    |------|-------|--------|--------|
    | W1 ↔ W4 | 3-2-1 | W4 found F1(H) in W1's code | W1 leads |
    | W2 ↔ W3 | 2-2-2 | W2 faster on subtask_021 | Tied |

  special_events:
    showdown:
      trigger: "Both rivals assigned to same cmd with separate subtasks"
      effect: "Side-by-side comparison of subtask quality -> loser buys winner 1 churu"
      announcement: "⚔️ RIVALRY SHOWDOWN: {worker_a} vs {worker_b} on {cmd_id}!"
    upset:
      trigger: "Lower-ranked rival beats higher-ranked rival in weekly tally"
      bonus: 1
      announcement: "🔥 UPSET! {underdog} beats {favorite} this week!"


# ============================================================================
# SECTION 13: FEATURE 12 — BOUNTY BOARD (懸賞掲示板)
# ============================================================================

feature_12_bounty_board:
  name: "懸賞掲示板 (Bounty Board)"

  posting:
    who_can_post:
      - "goshujinsama"
      - "oyabun"
      - "kashira"
    format:
      file: "queue/bounty_board.yaml"
      schema:
        bounty_id: "string (bounty_NNN)"
        title: "string (short, descriptive)"
        description: "string (detailed requirements)"
        category: "enum: [enforcement, quality, performance, exploration, red_team]"
        reward_churu: "integer (2-20)"
        posted_by: "string (goshujinsama|oyabun|kashira)"
        posted_at: "timestamp"
        expires_at: "timestamp or null (null = no expiry)"
        claimed_by: "string or null"
        claimed_at: "timestamp or null"
        status: "enum: [open, claimed, submitted, verified, expired]"
        resolution_criteria: "string (what counts as 'done')"

  reward_tiers:
    tier_1_minor:
      churu: "2-5"
      examples:
        - "Fix all remaining sp_021 patterns in a specific codebase"
        - "Add missing fields to 3+ existing reports"
    tier_2_moderate:
      churu: "6-10"
      examples:
        - "Find a bypass vector for C1 gate and propose fix"
        - "Create a reusable skill from a repeated workflow"
    tier_3_major:
      churu: "11-15"
      examples:
        - "Design and implement a new enforcement mechanism"
        - "Conduct full security audit of bridge communication"
    tier_4_legendary:
      churu: "16-20"
      examples:
        - "Find a critical governance vulnerability nobody knew about"
        - "Create a cross-system tool adopted by all 3 teams"

  lifecycle:
    claim: |
      1. Worker reads bounty_board.yaml
      2. Worker writes to kashira.queue: "TIMESTAMP|workerN|bounty_claim|bounty_NNN"
      3. Kashira validates (not already claimed, worker not overloaded) -> updates status to "claimed"
      4. Worker has until expires_at to submit (or unlimited if no expiry)
    submit: |
      1. Worker writes evidence/deliverable to outputs/bounties/bounty_NNN/
      2. Worker writes report to queue/reports/workerN_bounty_NNN_report.yaml
      3. Worker notifies kashira via inbox
    verify: |
      1. Kashira (or oyabun for tier 3-4) reviews submission against resolution_criteria
      2. If verified: status -> "verified", churu awarded, dashboard announcement
      3. If rejected: status -> "open" (re-claimable), rejection reason provided
    expiry: |
      Expired bounties return to "open" if unclaimed, or are closed by poster.
      No penalty for claiming and not completing — but repeated abandonment
      reduces priority for future claims.

  red_team:
    description: |
      "Find holes in your own enforcement" bounties. The most valuable
      category because workers actively try to break the system's rules.
      A found vulnerability is CELEBRATED, not punished.
    example_bounties:
      - title: "C1ゲート突破チャレンジ"
        description: "Find a way to bypass cmd_done_gate.sh validation. Propose fix."
        reward: 10
      - title: "R1ルール回避パス発見"
        description: "Identify a scenario where oyabun can legitimately avoid R1 delegation rule."
        reward: 8
      - title: "ブリッジ偽装テスト"
        description: "Can a malformed bridge message bypass validation? Prove it."
        reward: 12

  dashboard_section: |
    ### 📋 懸賞掲示板 (Bounty Board)
    | ID | Title | Reward | Status | Claimed By |
    |----|-------|--------|--------|------------|
    | bounty_001 | sp_021全滅作戦 | 5🐟 | open | — |
    | bounty_002 | C1ゲート突破チャレンジ | 10🐟 | claimed | W4 |


# ============================================================================
# SECTION 14: FEATURE 13 — TRADING CARDS (猫トレーディングカード)
# ============================================================================

feature_13_trading_cards:
  name: "猫トレーディングカード (Trading Cards)"

  stats:
    atk:
      name: "ATK (攻撃力)"
      meaning: "Code output quality"
      formula: "(avg_quality_multiplier x 100), capped at 100"
      scale: "0-100"
    def:
      name: "DEF (防御力)"
