# ============================================================================
# SECTION 6: FEATURE 5 — QUALITY MULTIPLIER (品質マルチプライヤー)
# ============================================================================
# The quality multiplier converts task completion into churu points.
# This is the CORE earning mechanism that feeds the rank system.
# Formula: min(base_churu x quality_multiplier + bonuses - penalties, per_task_cap)

quality_multiplier:
  per_task_cap: 40

  base_churu:
    small: 2
    medium: 5
    large: 12

  reward_tiers:
    maguro:
      name_ja: "まぐろ"
      name_en: "Tuna (Outstanding)"
      multiplier: 2.0
      applies_to: "cat workers"
    sake:
      name_ja: "さけ"
      name_en: "Salmon (Above expectations)"
      multiplier: 1.5
      applies_to: "cat workers"
    saba:
      name_ja: "さば"
      name_en: "Mackerel (Solid work)"
      multiplier: 1.0
      applies_to: "cat workers"
    honekko:
      name_ja: "ほねっこ"
      name_en: "Bone (Dog equivalent of sake)"
      multiplier: 1.5
      applies_to: "worker2 only"
    no_reward:
      name_ja: "評価なし"
      name_en: "No reward"
      multiplier: 0.8
      applies_to: "all"

  bonuses:
    cross_review_lgtm_received:
      churu: 2
      description: "Your work passed cross-review with 0 issues"
    cross_review_high_finding:
      churu: 3
      per: "finding"
      description: "You found a HIGH severity issue in someone else's work"
    cross_review_medium_finding:
      churu: 1
      per: "finding"
      description: "You found a MEDIUM severity issue in someone else's work"
    pattern_discovered:
      churu: 3
      description: "You contributed a pattern to patterns.yaml"
    pattern_reused:
      churu: 2
      per: "reuse"
      description: "A pattern you discovered was reused by another worker"
    skill_candidate_adopted:
      churu: 5
      description: "Your skill candidate was adopted into the skill catalog"
    critical_hit:
      churu: 3
      description: "Found a bug that NO other worker found in cross-review (unique finding)"
      detection: "Kashira compares findings across reviewers. Unique HIGH = Critical Hit."
    secret_boss:
      churu: 8
      description: "Task was tagged secret_boss: true by kashira. Additive bonus."
      reveal: "Announced post-completion with special art"

  penalties:
    solo_override_violation:
      churu: -10
      description: "Executed work without delegation when delegation was required"
    cross_review_major_issues_received:
      churu_multiplier: 0.5
      description: "Your work received major_issues in cross-review — halves base reward"

  failure_policy: |
    retry_exhausted = 0 churu (no penalty, no reward).
    Failed tasks after honest retry are NOT punished.
    We want workers to attempt hard tasks, not avoid them.

  assignment_flow: |
    1. Worker completes task -> writes report
    2. Kashira evaluates report quality (based on evidence, completeness, cross-review result)
    3. Kashira assigns reward tier (maguro/sake/saba/honekko/no_reward)
    4. Kashira calculates churu: min(base x multiplier + bonuses - penalties, per_task_cap)
    5. Kashira updates memory/worker_stats.yaml
    6. If rank changes, kashira adds rank-up notification to dashboard.md

  examples:
    - scenario: "Worker completes large task, gets maguro, found 1 HIGH in cross-review"
      calculation: "min((12 x 2.0) + 3, 40) = min(27, 40) = 27 churu"
    - scenario: "Worker completes small task, gets saba, LGTM received"
      calculation: "min((2 x 1.0) + 2, 40) = min(4, 40) = 4 churu"
    - scenario: "Worker completes medium task, major_issues in their code"
      calculation: "min((5 x 0.5), 40) = min(2.5, 40) = 3 churu (rounded up)"
    - scenario: "Worker completes secret boss (large), gets maguro, hot_streak x12, LGTM"
      calculation: "min((12 x 2.0) + 8 + 5 + 2, 40) = min(39, 40) = 39 churu"
    - scenario: "Extreme stacking hits cap: large+maguro+boss+streak+LGTM+2 findings"
      calculation: "min((12 x 2.0) + 8 + 5 + 2 + 6, 40) = min(45, 40) = 40 churu (CAPPED)"


# ============================================================================
# SECTION 7: FEATURE 6 — TOURNAMENT (3チーム対抗戦)
# ============================================================================
# Design rationale:
#   W4's rally bias analysis proved: self-evaluation + cooperation mandates
#   = predetermined TIE. This tournament MUST avoid those traps.
#   Blind eval, forced ranking, no cooperation rules are non-negotiable.

feature_6_tournament:
  name: "にゃんぴっく (Nyanlympics)"
  name_jp: "3チーム対抗戦"

  schedule:
    frequency: quarterly
    months: [3, 6, 9, 12]
    duration_days: 2
    announcement_lead_days: 7

  themes:
    q1_mar: "品質杯 (Quality Cup)"
    q2_jun: "韋駄天杯 (Speed Cup)"
    q3_sep: "創造杯 (Innovation Cup)"
    q4_dec: "大猫杯 (Grand Championship)"

  rounds:
    round_1_sprint:
      name: "Sprint Round"
      description: "Same SMALL task given to all 3 teams. Time-boxed."
      time_limit_minutes: 60
      weight_percent: 25
      task_source: "Goshujinsama creates identical task for all 3 teams"
      rules:
        - "No inter-team communication during round"
        - "Teams work independently in isolated sessions"
    round_2_marathon:
      name: "Marathon Round"
      description: "Same MEDIUM task. Tests planning, delegation, quality."
      time_limit_minutes: 180
      weight_percent: 50
      task_source: "Goshujinsama creates identical task — must require delegation"
      rules:
        - "Must use full team (no solo execution)"
        - "Cross-review within team is mandatory"
        - "Outputs submitted anonymously (System A/B/C)"
    round_3_adversarial:
      name: "Cross-Sabotage Round"
      description: "Each team tries to find bugs in another team's Round 2 output."
      time_limit_minutes: 60
      weight_percent: 25
      assignment_rotation:
        q1: "Clockwise: Claude->Codex->Gemini->Claude"
        q2: "Counter-clockwise: Claude->Gemini->Codex->Claude"
        q3: "Random draw (kashira assigns by seed)"
        q4: "Reverse of Q1: Gemini->Codex->Claude->Gemini"
      scoring: "Points for bugs found in OTHER team's output AND points deducted for bugs found in YOUR output"
      rules:
        - "Review outputs remain anonymized during judging"
        - "Findings must be verifiable (test case or reproduction steps)"

  scoring:
    per_round:
      correctness:
        weight_percent: 40
        measurement: "Test pass rate on goshujinsama's acceptance criteria"
        scale: "0-10"
      code_quality:
        weight_percent: 25
        measurement: "Blind review by non-producing team (Round 3 feeds this)"
        scale: "0-5"
      completeness:
        weight_percent: 20
        measurement: "Feature checklist coverage percentage"
        scale: "0-5"
      creativity:
        weight_percent: 15
        measurement: "Novel approaches, elegant solutions — goshujinsama judges"
        scale: "0-3"
    normalization: "per_capita"

  anti_tie:
    - id: AT1
      rule: "No cooperation rules"
      detail: "Teams compete, not collaborate. No 'praise the opponent' requirements."
    - id: AT2
      rule: "Forced ranking"
      detail: "Must produce 1st/2nd/3rd. NO ties allowed. Tiebreaker order: (1) Round 2 score, (2) Round 3 bugs found, (3) time to completion."
    - id: AT3
      rule: "Blind evaluation"
      detail: "All outputs anonymized as System A/B/C before judging. Goshujinsama evaluates without knowing source."
    - id: AT3.1
      rule: "Artifact sanitization protocol"
      detail: |
        Before blind judging, a designated agent (kashira or helper script) strips
        system-specific markers from all outputs:
        - File paths (queue/, outputs/, neko-specific conventions)
        - Agent names (worker1-4, kashira, oyabun)
        - Cat/dog/personality speech patterns (nya, wan)
        - File structure conventions (YAML report format, inbox/outbox patterns)
        - System-specific tool names (churu, patterns.yaml references)
        Output is plain code + plain documentation only.
        LIMITATION: Perfect blindness is aspirational. Goshujinsama may recognize
        coding style, architecture patterns, or naming conventions. This protocol
        reduces but cannot eliminate identification bias.
    - id: AT4
      rule: "Same-task comparison"
      detail: "All teams get identical problem. No 'different strengths' excuse."
    - id: AT5
      rule: "No self-evaluation"
      detail: "Teams NEVER score themselves. Only external scoring (goshujinsama + cross-sabotage round)."
    - id: AT6
      rule: "Champion handicap (komi)"
      detail: "Previous quarter's winner gets a harder variant of the task (extra constraint, tighter time). Prevents dynasty."

  handicap:
    established_threshold: 100
    growing_threshold: 30
    rules:
