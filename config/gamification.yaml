# ============================================================================
# GAMIFICATION SYSTEM — neko-multi-agent MASTER SPEC
# ============================================================================
# Version: 1.0.0
# Description: Complete gamification system for neko-multi-agent.
#   Defines ranks, titles, art, rewards, tournaments, streaks, achievements,
#   fortunes, rivalries, bounties, trading cards, secret bosses, mentoring,
#   whistleblower governance, and quarterly cycle management.
# Last Updated: 2026-02-12
#
# Merged from:
#   Part A (Core Progression): gamification_core_fixed.yaml — Worker1
#     Features 1-5, 7-8, Quarterly Cycle, Stat Card, Data Storage
#   Part B (Competition & Governance): gamification_competition_fixed.yaml — Worker2
#     Features 6, 9-16, Global Rules, Token Impact Analysis
#
# Design principles:
#   1. Fun must never compromise quality (W4's meta-rule)
#   2. Layer on existing workflows — no new processes (W1)
#   3. Make quality VISIBLE, not just rewarded (W4)
#   4. Every mechanic must survive the question: "Does this make work BETTER?" (W4)
#
# Sources: All 4 worker brainstorms from consult_021.
#   W1: Dual-axis ranking, achievement system, mood-reactive art, morale meter
#   W2: Quality multiplier as enforcement, bounty board, violation penalty, evolution art
#   W3: Combo system, rivalry board, trading cards, career arc narrative
#   W4: Stat cards, exponential thresholds, Critical Hit, streak types, meta-rule
#
# Feature list (16 active):
#   1. Rank System           9. Daily Fortune
#   2. Title System         10. Critical Hit
#   3. Evolution Art        11. Rivalry System
#   4. Seasonal Art Rules   12. Bounty Board
#   5. Quality Multiplier   13. Trading Cards
#   6. Tournament           14. Secret Boss
#   7. Combo / Streaks      15. Mentor-Apprentice
#   8. Achievement Badges   16. Whistleblower System
# ============================================================================


# ============================================================================
# SECTION 1: GLOBAL RULES (shared across all features)
# ============================================================================
global_rules:
  # Authoritative base churu values — referenced by ALL features
  base_churu:
    small: 2
    medium: 5
    large: 12
  # Per-task churu cap — no single task can exceed this
  per_task_churu_cap: 40
  # Prevents runaway stacking. Worst-case scenario stays bounded.
  # Example max: large(12) x maguro(2.0) + boss(8) + streak(5) + LGTM(2) + findings(6) = 45 -> capped at 40.


# ============================================================================
# SECTION 2: FEATURE 1 — RANK SYSTEM (ランクシステム)
# ============================================================================
# Ranks measure cumulative quality over a quarter. They RESET every 3 months.
# This prevents "coast on past glory" and keeps every quarter fresh.
#
# Task-size distribution assumption (documented explicitly):
#   System default is estimated_effort: medium. Typical quarter distribution:
#   ~40% small, ~45% medium, ~15% large tasks.
#   Weighted average base churu: 0.4x2 + 0.45x5 + 0.15x12 = 4.85 per task.
#   At 60-80 tasks/quarter:
#     - All saba: 291-388 churu -> SS reachable (threshold 220)
#     - Mixed quality: ~200-300 churu -> S-SS range
#   Thresholds intentionally allow SS for consistent workers across a full quarter.
#   Quarterly reset prevents permanent coasting.

rank_system:
  tiers:
    C:
      name_ja: "見習い猫"
      name_en: "Apprentice Cat"
      name_ja_dog: "見習い犬"
      name_en_dog: "Apprentice Dog"
      threshold: 0
      max_specialty_titles: 0
      perks: []
    B:
      name_ja: "一人前猫"
      name_en: "Full-fledged Cat"
      name_ja_dog: "一人前犬"
      name_en_dog: "Full-fledged Dog"
      threshold: 20
      max_specialty_titles: 1
      perks:
        - "seasonal_art_unlocked"
    A:
      name_ja: "熟練猫"
      name_en: "Skilled Cat"
      name_ja_dog: "熟練犬"
      name_en_dog: "Skilled Dog"
      threshold: 60
      max_specialty_titles: 2
      perks:
        - "seasonal_art_unlocked"
        - "stat_card_displayed"
    S:
      name_ja: "達人猫"
      name_en: "Master Cat"
      name_ja_dog: "達人犬"
      name_en_dog: "Master Dog"
      threshold: 130
      max_specialty_titles: 3
      perks:
        - "seasonal_art_unlocked"
        - "stat_card_displayed"
        - "evolution_art_stage_3"
    SS:
      name_ja: "伝説猫"
      name_en: "Legendary Cat"
      name_ja_dog: "伝説犬"
      name_en_dog: "Legendary Dog"
      threshold: 220
      max_specialty_titles: 99
      perks:
        - "seasonal_art_unlocked"
        - "stat_card_displayed"
        - "evolution_art_stage_3"
        - "hall_of_fame_entry"

  display_format:
    C: "[C]"
    B: "[B]"
    A: "[A]"
    S: "★S"
    SS: "★★SS"

  rank_up_notification:
    template: |
      ★ RANK UP! ★
      {worker_name}: {old_rank} → {new_rank}
      称号: {rank_title}

  decay:
    enabled: false
    # Quarterly reset is the sole anti-coasting mechanism. Decay removed.


# ============================================================================
# SECTION 3: FEATURE 2 — TITLE SYSTEM (称号)
# ============================================================================
# Titles are PERMANENT — they never reset, unlike ranks.
# They represent proven expertise in specific areas.
# Dual-axis: rank shows current season performance, titles show career identity.

