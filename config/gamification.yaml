  feature_12_bounty_board:
    instruction_tokens: 60
    config_tokens: 100
    runtime_tokens: 10
    notes: "Very low. Bounty board is read-on-demand, not per-task."
  feature_13_trading_cards:
    instruction_tokens: 30
    config_tokens: 50
    runtime_tokens: 0
    notes: "Zero per-task overhead. Purely on-demand."
  feature_14_secret_boss:
    instruction_tokens: 20
    config_tokens: 40
    runtime_tokens: 20
    notes: "Intentionally minimal in worker instructions (surprise element)."
  feature_15_mentor_apprentice:
    instruction_tokens: 80
    config_tokens: 50
    runtime_tokens: 0
    notes: "Zero overhead when not active. Situational feature."
  feature_16_whistleblower:
    instruction_tokens: 120
    config_tokens: 60
    runtime_tokens: 10
    notes: "Instruction-heavy (clarity prevents false accusations). Runtime minimal."

  totals:
    active_features: 16
    instruction_tokens_total: 1270
    config_tokens_total: 3100
    runtime_tokens_per_task: 350
    runtime_tokens_per_session: 550

  optimization:
    recommendation_1:
      title: "Lazy-load gamification config"
      detail: |
        Don't load gamification.yaml on every task. Load it:
        - On session startup (seasonal art, fortune, rank display)
        - On report processing (kashira: churu calculation, achievement check)
        - On demand (card generation, bounty board check)
        Token savings: ~2000 tokens per task (config not loaded)
    recommendation_2:
      title: "Separate instruction tiers"
      detail: |
        Split gamification instructions into 3 tiers:
        - CORE (always loaded): Rank system, churu formula, basic rules (~400 tokens)
        - REFERENCE (loaded on demand): Title list, achievement list, tournament rules (~500 tokens)
        - RARE (loaded when triggered): Whistleblower process, mentor protocol (~270 tokens)
        Token savings: ~770 tokens per task for most tasks
    recommendation_3:
      title: "Minimize fortune pool in instructions"
      detail: |
        Fortune messages should be in config/fortunes.yaml, NOT in instruction files.
        Worker instruction just says "display fortune from config on first task of day."
        Token savings: ~500 tokens not in instruction files
    recommendation_4:
      title: "Seasonal art as external files"
      detail: |
        Store art as text files in assets/seasonal_art/ (W3 proposal).
        Workers cat the file on display — no YAML parsing needed.
        Token savings: ~800 tokens out of config YAML
    recommendation_5:
      title: "Post-compaction gamification recovery"
      detail: |
        After compaction, workers lose: rank context, streak count, fortune of the day,
        rivalry pairing awareness. Recovery protocol:
        1. Workers read memory/worker_stats.yaml on post-compaction wakeup
        2. worker_stats.yaml contains: rank, total_churu, current_streak, rival_pair, last_fortune_date
        3. Add gamification_summary section to compaction summary template:
           "Current rank: {rank}, Streak: {streak}, Rival: {rival}, Churu: {total}"
        4. Fortune is re-derived from date (deterministic seed — no state needed)
        Token cost: ~30 tokens added to compaction summary template. Negligible.
    recommendation_6:
      title: "Total budget assessment"
      detail: |
        With all 5 optimizations applied:
        - Instruction overhead: ~400 tokens (CORE tier only)
        - Per-task runtime: ~150 tokens (realistic, not worst-case)
        - Per-session startup: ~480 tokens (one-time)
        - Post-compaction recovery: ~30 tokens (one-time)

        Current _worker_base.md is ~4000 tokens.
        Adding 400 = 10% increase. Per-task 150 tokens is negligible
        compared to the ~8000-20000 tokens in a typical task response.

        VERDICT: Gamification system fits within acceptable token budget
        IF lazy-loading and tiered instructions are implemented.


# ============================================================================
# SECTION 19: QUARTERLY CYCLE (四半期サイクル)
# ============================================================================
# Defines what resets, persists, and happens at quarter boundaries.

quarterly_cycle:
  quarters:
    Q1: { start: "01-01", end: "03-31", name_ja: "春季" }
    Q2: { start: "04-01", end: "06-30", name_ja: "夏季" }
    Q3: { start: "07-01", end: "09-30", name_ja: "秋季" }
    Q4: { start: "10-01", end: "12-31", name_ja: "冬季" }

  resets:
    - field: "rank_churu_total"
      description: "All workers return to C rank. Fresh start every quarter."
    - field: "combo_streaks"
      description: "All streaks reset to 0. New quarter, new streaks."
    - field: "perfect_week_count"
      description: "Weekly perfection counter resets."

  persists:
    - field: "specialty_titles"
      description: "Once earned, forever yours. Titles are permanent career achievements."
    - field: "achievement_badges"
      description: "Badges are permanent. Your achievement history tells your story."
    - field: "lifetime_churu_total"
      description: "Separate from rank churu. Tracks career-total for legacy purposes."
    - field: "legacy_wall_entries"
      description: "Hall of fame entries are permanent. Legends never die."
    - field: "stat_card_history"
      description: "End-of-quarter stat snapshot saved for career progression tracking."

  shuffles:
    - field: "rivalry_pairs"
