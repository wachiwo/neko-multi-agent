  end_of_quarter_ceremony:
    report_contents:
      - section: "Quarter Summary"
        includes:
          - "Final rank standings for all workers"
          - "Total churu earned per worker"
          - "Specialty titles earned this quarter"
          - "Achievement badges unlocked this quarter"
          - "Longest streaks achieved"
      - section: "Quarter MVP"
        includes:
