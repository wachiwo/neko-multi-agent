feature_9_daily_fortune:
  name: "今日の運勢 (Daily Fortune)"

  selection:
    method: "two_step_weighted"
    step_1_level_selection:
      description: "Pick fortune level by weighted probability"
      formula: "level_seed = (YYYYMMDD * 7 + worker_id_num) % 100"
      weight_ranges:
        "0-9": "大吉"
        "10-34": "吉"
        "35-64": "中吉"
        "65-84": "小吉"
        "85-94": "末吉"
        "95-99": "凶"
    step_2_message_selection:
      description: "Pick message within the selected level"
      formula: "msg_seed = (YYYYMMDD * 13 + worker_id_num * 3) % level_pool_size"
      note: "Different prime multiplier ensures level and message seeds are independent"

  display:
