# ============================================================================
# SECTION 17: FEATURE 16 — WHISTLEBLOWER SYSTEM (通報制度)
# ============================================================================
# Principle: 自首は減刑、隠蔽は厳罰
# Burden-of-proof clause prevents witch-hunts.

feature_16_whistleblower:
  name: "通報制度 (Whistleblower System)"
  principle: "自首は減刑、隠蔽は厳罰"

  definitions:
    concealment: |
      INTENTIONAL hiding of known bugs, errors, or problems.
      Evidence: worker's own logs/history show the issue was encountered
      but not reported. "I saw it but didn't mention it."
    negligence: |
      Failing to NOTICE a bug or error. Honest oversight.
      Evidence: no indication the worker was aware of the issue.
      "I didn't see it."
    self_report: |
      Worker voluntarily reports their own mistake before it's discovered
      by someone else. "I made this mistake and here's what happened."

  burden_of_proof:
    principle: "Concealment requires POSITIVE evidence of awareness. Absence of evidence defaults to negligence."
    positive_evidence_examples:
      - "Error message visible in worker's execution log or report notes"
      - "Worker's output references the affected code path (proves traversal)"
      - "Worker explicitly mentioned a related issue but omitted the specific bug"
      - "Retry history shows the error was encountered and not documented"
    default_ruling: |
      If no positive evidence of awareness exists, the ruling MUST be negligence,
      regardless of suspicion. This prevents:
      - Witch-hunts based on circumstantial evidence
      - Penalizing workers for context window limitations
      - Punishing LLM agents for probabilistic output omissions
    llm_calibration_note: |
      LLM agents don't have "intent" in the human sense. "Concealment" in an LLM
      context means: information was demonstrably in context AND the agent produced
      output that specifically excluded it in a pattern inconsistent with normal behavior.
      This is a HIGH bar by design — false positives are worse than false negatives
      in a punishment system.

  reporting:
    how_to_report:
      step_1: "Worker writes to kashira.queue: 'TIMESTAMP|workerN|whistleblower|description'"
      step_2: "Kashira escalates to oyabun with evidence request"
      step_3: "Oyabun reviews evidence against burden_of_proof criteria and determines: concealment vs negligence vs false alarm"
    evidence_requirements:
      concealment_proof:
        - "Worker's own report shows awareness of the issue (log entries, error messages encountered)"
        - "Issue was not mentioned in the worker's report despite being in their execution path"
        - "Timeline analysis: error occurred BEFORE report submission"
        - "At least ONE positive evidence item from burden_of_proof.positive_evidence_examples MUST be present"
      negligence_proof:
        - "No positive evidence of awareness found"
        - "Issue was in a code path the worker didn't traverse"
        - "Reasonable to have missed given task scope"
        - "Ambiguous cases (traversed path, no log entry) -> DEFAULT to negligence"

  adjudication:
    judge: "oyabun"
    appeal: "Worker can appeal to goshujinsama if they believe oyabun's judgment is wrong"
    appeal_process: |
      1. Worker writes detailed appeal to queue/approval_required.yaml
      2. Goshujinsama reviews evidence and oyabun's ruling
      3. Goshujinsama's decision is final
    oyabun_recusal: |
      If the accused is oyabun, adjudication goes directly to goshujinsama.
      Any agent can trigger this by writing to dashboard.md "要対応" section.

  penalties:
    concealment_confirmed:
      rank_penalty: "DOWN 1 full rank level (e.g., A -> B)"
      churu_penalty: -10
      team_impact: "Team loses 5 tournament points for the quarter"
      record: "Recorded in memory/violations.yaml permanently"
      announcement: |
        ⚠️ 隠蔽発覚: {worker_name} — {description}
        ランクダウン: {old_rank} → {new_rank}
        チーム減点: -5 tournament points
    repeat_offense:
      additional: "Double penalty on second offense within same quarter"
      third_offense: "Escalated to goshujinsama for possible role reassignment"

  rewards:
    self_report:
      penalty: "NONE — no rank penalty, no churu penalty"
      bonus: 1
      record: "Noted positively in worker stats"
      message: "自首は勇気にゃ。ペナルティなしにゃ。"
    whistleblower:
      churu_bonus: 5
      record: "Recorded as positive contribution"
      anonymity: "Whistleblower identity is protected. Only oyabun/goshujinsama know who reported."
      message: "通報ありがとうにゃ。品質を守ったにゃ。"
    false_alarm:
      penalty: "NONE — better safe than sorry"
      note: "Repeated false alarms (3+) may trigger a calibration conversation, not punishment"

  negligence:
    penalty: "NONE"
    action: "Kashira adds the missed issue to patterns.yaml as a learning entry"
    note: "Negligence is a training opportunity, not a punishment event"

  c1_interaction: |
    When C1 gate (cmd_done_gate.sh) detects a violation:
    1. If violation appears intentional (e.g., worker_count manipulated): trigger whistleblower process
    2. If violation appears accidental (e.g., missing field): kashira returns report for correction
    3. C1 gate logs ALL violations regardless of intent -> audit trail for future adjudication


