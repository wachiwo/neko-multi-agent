# ============================================================================
# SECTION 15: FEATURE 14 — SECRET BOSS (隠しボス)
# ============================================================================
# Additive +8 churu bonus (NOT multiplicative). Prevents inflation.

feature_14_secret_boss:
  name: "隠しボス (Secret Boss)"

  detection:
    method: "post_hoc"
    criteria:
      condition_1: "estimated_effort was 'small' but actual work required medium+ effort"
      condition_2: "Task required 2+ retries before success"
      condition_3: "Cross-review found 0 issues despite task complexity (hidden quality challenge)"
      condition_4: "Task involved new technology/domain not in patterns.yaml"
    who_decides: "kashira"

  reward:
    churu_bonus: 8
    # Examples:
    #   small(2) x maguro(2.0) + boss(8) = 12 churu
    #   medium(5) x maguro(2.0) + boss(8) = 18 churu
    #   large(12) x maguro(2.0) + boss(8) = 32 churu
    #   large(12) x maguro(2.0) + boss(8) + critical_hit(3) = 35 churu (under 40 cap)

  reveal:
    timing: "In kashira's report response to the worker"
    format: |
      ╔═══════════════════════════════════════════╗
      ║                                           ║
      ║     ★★★ SECRET BOSS DEFEATED! ★★★        ║
      ║                                           ║
      ║     {worker_name} conquered {task_id}     ║
      ║     Difficulty: {actual_difficulty}        ║
      ║     Reward: base({base_churu}) + boss(8)  ║
      ║            = {total} churu!                ║
      ║                                           ║
      ╚═══════════════════════════════════════════╝
    dashboard_log: true

  frequency:
    target: "~1 in 10 tasks"
    max_per_cmd: 1
    cooldown_tasks: 5

  anti_gaming:
    - "Workers CANNOT request or nominate secret boss tasks"
    - "Kashira MUST NOT reveal boss status in task YAML or hints"
    - "Boss determination is purely post-hoc — no pre-assignment marking"


