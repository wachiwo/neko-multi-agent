# ============================================================================
# SECTION 8: FEATURE 7 — COMBO / STREAKS (コンボ・連続記録)
# ============================================================================
# Consecutive quality work builds combos that add bonus churu.
# Arcade-game psychology: the streak itself becomes something you protect.
# Three streak types: Hot Streak, Ice Streak, Perfect Week.

combo_system:
  hot_streak:
    name_ja: "炎の連鎖"
    name_en: "Hot Streak"
    icon: "🔥"
    description: "Consecutive tasks completed with sake or maguro rating"
    levels:
      - streak_count: 3
        bonus_churu: 1
        display: "🔥x3"
      - streak_count: 5
        bonus_churu: 2
        display: "🔥🔥x5"
      - streak_count: 8
        bonus_churu: 3
        display: "🔥🔥🔥x8"
      - streak_count: 12
        bonus_churu: 5
        display: "🔥🔥🔥🔥x12 BLAZING!"
    break_conditions:
      - "Task completed with saba rating (baseline = streak break)"
      - "Task completed with no_reward"
      - "Task failed (retry_exhausted)"
      - "Received major_issues in cross-review"
    persistence: "Streaks persist across sessions. Stored in memory/worker_stats.yaml."

  ice_streak:
    name_ja: "氷の連鎖"
    name_en: "Ice Streak"
    icon: "❄️"
    description: "Consecutive cross-reviews completed with detailed analysis (regardless of finding count)"
    qualification_criteria: |
      A cross-review counts toward Ice Streak if:
      1. Review covers all focus_areas specified in the task
      2. Report includes substantive summary (not just "LGTM")
      3. Any findings are specific and actionable (file, line, issue, suggestion)
      Kashira evaluates review thoroughness, not finding count.
      A thorough LGTM ("reviewed X, Y, Z — no issues found") counts.
      A lazy LGTM ("looks fine") does NOT count.
    levels:
      - streak_count: 3
        bonus_churu: 1
        display: "❄️x3"
      - streak_count: 5
        bonus_churu: 2
        display: "❄️❄️x5"
      - streak_count: 8
        bonus_churu: 3
        display: "❄️❄️❄️x8 FROZEN!"
    break_conditions:
      - "Cross-review submitted without covering all focus_areas"
      - "Cross-review summary is insufficiently detailed (kashira judgment)"
      - "Fabricated or trivially inflated findings detected"
    anti_gaming: |
      Kashira evaluates review THOROUGHNESS, not finding count.
      Fabricated findings still incur -2 churu penalty.
      But honest LGTM with detailed notes is now valid — no perverse incentive to invent issues.

  perfect_week:
    name_ja: "完璧週"
    name_en: "Perfect Week"
    icon: "⭐"
    description: "All tasks completed in a calendar week (Mon-Sun) rated sake or maguro"
    reward:
      bonus_churu: 8
    minimum_tasks: 3
    display: "⭐ Perfect Week!"

  dashboard_display: |
    Example: "W1: [A] Bug Sniper | 🔥x5 | ❄️x3"
    Streaks shown in agent status table alongside rank and title.


