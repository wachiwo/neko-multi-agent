  feature_9_daily_fortune:
    instruction_tokens: 30
    config_tokens: 500
    runtime_tokens: 40
    notes: "Config-heavy but loaded once per day. Message pool is static."
  feature_10_critical_hit:
    instruction_tokens: 50
