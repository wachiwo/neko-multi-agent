# ============================================================
# Language-Specific Review Criteria
# ============================================================
# Centralized review checklists for cross-review and kashira review.
# To add a new language: copy an existing language block and customize.
#
# Usage:
#   - kashira embeds the relevant checklist into review task YAML
#   - Workers (reviewers) follow base + language-specific checks
#   - File extension mapping determines which language block to use

# File Extension → Language Key Mapping
extension_map:
  ".html": html_css
  ".htm": html_css
  ".css": html_css
  ".php": php
  ".cs": csharp
  ".scss": scss
  ".sass": scss
  ".cpp": cpp
  ".cc": cpp
  ".cxx": cpp
  ".h": cpp
  ".hpp": cpp
  ".py": python
  ".js": javascript
  ".ts": typescript

# Base Checklist (applies to ALL languages)
base_checklist:
  - id: B1
    category: syntax
    check: "No syntax errors; code compiles/runs without issues"
  - id: B2
    category: security
    check: "No injection, XSS, credential leaks, or OWASP Top 10 risks"
  - id: B3
    category: performance
    check: "No unnecessary loops, N+1 queries, or memory leak risks"
  - id: B4
    category: readability
    check: "Variable/function names are clear; logic is easy to follow"
  - id: B5
    category: spec_compliance
    check: "Deliverable satisfies the original instruction (objective)"
  - id: B6
    category: interface_contract
    check: "For modules that produce/consume data: verify output format matches downstream consumer's expected input. Trace one data path across the boundary."

# Language-Specific Extensions
languages:
  html_css:
    display_name: "HTML / CSS"
    checklist:
      - id: HC1
        category: accessibility
        check: "Proper alt attributes, ARIA labels, semantic HTML elements"
      - id: HC2
        category: responsive
        check: "Layout works on mobile/tablet/desktop breakpoints"
      - id: HC3
        category: cross_browser
        check: "No vendor-prefix-only properties without fallbacks"
      - id: HC4
        category: validation
        check: "Valid HTML structure (no unclosed tags, proper nesting)"
      - id: HC5
        category: css_scope
        check: "Batch CSS fix: changes limited to task YAML specified properties. No unintended overflow/z-index/position changes."
      - id: HC6
        category: css_regression
        check: "No overflow:hidden on .main-content/.sidebar/.container (sp_034). No position:sticky z-index conflicts with form elements."
      - id: HC7
        category: functional_smoke
        check: "Primary CTAs (search/output/register) in viewport top area, visible on initial load. Output buttons NOT at page bottom."
      - id: HC8
        category: css_diff
        check: "HTML diff before/after confirms NO CSS property changes outside task scope."

  php:
    display_name: "PHP"
    checklist:
      - id: PHP1
        category: security
        check: "Prepared statements for all DB queries (no string concatenation)"
      - id: PHP2
        category: security
        check: "User input sanitized with htmlspecialchars() or equivalent"
      - id: PHP3
        category: error_handling
        check: "Proper try-catch, no exposed error details to end users"
      - id: PHP4
        category: compatibility
        check: "No deprecated functions; target PHP version compatibility confirmed"

  csharp:
    display_name: "C#"
    checklist:
      - id: CS1
        category: null_safety
        check: "Nullable reference types handled; no unguarded null dereferences"
      - id: CS2
        category: resource_management
        check: "IDisposable objects properly disposed (using statement or try-finally)"
      - id: CS3
        category: async
        check: "async/await used correctly; no fire-and-forget without reason"
      - id: CS4
        category: naming
        check: "PascalCase for public members, camelCase for locals per .NET conventions"
      - id: CS5
        category: linq
        check: "LINQ queries are readable; no excessive chaining that hurts clarity"
      - id: CS6
        category: exception
        check: "Specific exception types caught (not bare catch); no swallowed exceptions"

  scss:
    display_name: "SCSS / Sass"
    checklist:
      - id: SC1
        category: nesting
        check: "Nesting depth ≤ 3 levels (avoid over-specificity)"
      - id: SC2
        category: variables
        check: "Colors, fonts, and breakpoints use variables (no magic values)"
      - id: SC3
        category: structure
        check: "Partials organized logically; no circular @import/@use dependencies"

  cpp:
    display_name: "C / C++"
    checklist:
      - id: CPP1
        category: memory
        check: "No memory leaks; every new/malloc has matching delete/free or smart pointer"
      - id: CPP2
        category: bounds
        check: "Array/buffer bounds checked; no out-of-bounds access risk"
      - id: CPP3
        category: initialization
        check: "All variables initialized before use"
      - id: CPP4
        category: undefined_behavior
        check: "No reliance on undefined behavior (signed overflow, dangling pointers, etc.)"

  python:
    display_name: "Python"
    checklist:
      - id: PY1
        category: typing
        check: "Type hints used for function signatures"
      - id: PY2
        category: imports
        check: "No wildcard imports; imports organized (stdlib, third-party, local)"
      - id: PY3
        category: exceptions
        check: "Specific exceptions caught (not bare except)"
      - id: PY4
        category: style
        check: "PEP 8 compliant (naming, spacing, line length)"
      - id: PY5
        category: integration
        check: "SQL JOIN functions have row count assertions, zero-result guards, and cartesian product detection in tests"

  javascript:
    display_name: "JavaScript"
    checklist:
      - id: JS1
        category: strict_mode
        check: "No implicit globals; 'use strict' or ES modules used"
      - id: JS2
        category: async
        check: "Promises properly handled; no unhandled rejections or callback hell"
      - id: JS3
        category: equality
        check: "Strict equality (===) used instead of loose equality (==)"
      - id: JS4
        category: dom
        check: "DOM manipulation is safe; no innerHTML with unsanitized user input"

  typescript:
    display_name: "TypeScript"
    checklist:
      - id: TS1
        category: typing
        check: "No 'any' type without justification; proper type definitions used"
      - id: TS2
        category: null_safety
        check: "Strict null checks; optional chaining (?.) and nullish coalescing (??) used appropriately"
      - id: TS3
        category: async
        check: "Promises properly typed; no unhandled rejections"
      - id: TS4
        category: interfaces
        check: "Interfaces/types defined for data structures; no implicit object shapes"

  bootstrap_conversion:
    display_name: "Bootstrap 5 Conversion"
    checklist:
      - id: BS1
        category: overflow
        check: "Any fixed width > 800px inside .col-* containers requires overflow-x containment on the parent"
      - id: BS2
        category: overflow
        check: "col-sm main content has overflow-x: hidden or auto"
      - id: BS3
        category: responsive
        check: "table-responsive wraps ALL wide tables"
      - id: BS4
        category: consistency
        check: "Same width strategy as reference (% vs px); if different, document why"
      - id: BS5
        category: css_external
        check: "Page-specific CSS in external .css file (assets/page-name.css), not inline <style> blocks"

  # --- Extension Guide ---
  # To add a new language, add a block here following the pattern above,
  # then add the file extension mapping to extension_map at the top.
  # Example for Go:
  #
  # go:
  #   display_name: "Go"
  #   checklist:
  #     - id: GO1
  #       category: error_handling
  #       check: "All errors checked; no ignored error returns"

# ============================================================
# Security Review Checklists
# ============================================================
# Used by security_review tasks (type: security_review).
# Two complementary perspectives: attacker (black) and defender (white).
# Kashira assigns one worker per role during security review phase.

security_review:
  black_hacker:
    display_name: "Black Hacker (Attacker Perspective)"
    checklist:
      - id: BH1
        category: injection
        check: "Attempt SQL injection via all user-controlled inputs (form fields, query params, headers)"
      - id: BH2
        category: xss
        check: "Attempt stored/reflected XSS by injecting script tags and event handlers into every output point"
      - id: BH3
        category: csrf
        check: "Verify state-changing requests lack CSRF tokens or accept cross-origin requests"
      - id: BH4
        category: auth_bypass
        check: "Attempt to access protected endpoints without valid session/token; test expired/forged tokens"
      - id: BH5
        category: idor
        check: "Manipulate object IDs in URLs/params to access other users' resources (horizontal privilege escalation)"
      - id: BH6
        category: path_traversal
        check: "Inject ../ sequences and encoded variants into file path parameters to read arbitrary files"
      - id: BH7
        category: ssrf
        check: "Submit internal/loopback URLs (127.0.0.1, metadata endpoints) via URL input fields"
      - id: BH8
        category: deserialization
        check: "Identify deserialization entry points; check for unsafe deserialize calls on untrusted data"
      - id: BH9
        category: secrets_exposure
        check: "Search codebase for hardcoded API keys, passwords, tokens, and connection strings"
      - id: BH10
        category: privilege_escalation
        check: "Attempt vertical escalation by modifying role/permission fields in requests or tokens"

  white_hacker:
    display_name: "White Hacker (Defender Perspective)"
    checklist:
      - id: WH1
        category: input_validation
        check: "All user input validated server-side with allowlists; reject-by-default for unexpected input"
      - id: WH2
        category: output_encoding
        check: "All dynamic output HTML-encoded/escaped appropriate to context (HTML, JS, URL, CSS)"
      - id: WH3
        category: parameterized_queries
        check: "All database queries use parameterized statements or ORM; zero string concatenation in SQL"
      - id: WH4
        category: cors_policy
        check: "CORS Access-Control-Allow-Origin is not wildcard (*) for authenticated endpoints"
      - id: WH5
        category: csp_headers
        check: "Content-Security-Policy header set; no unsafe-inline/unsafe-eval without justification"
      - id: WH6
        category: rate_limiting
        check: "Authentication and sensitive endpoints have rate limiting or throttling configured"
      - id: WH7
        category: token_handling
        check: "Auth tokens stored securely (HttpOnly cookies or secure storage); no tokens in URLs or localStorage"
      - id: WH8
        category: error_leakage
        check: "Error responses do not expose stack traces, SQL queries, internal paths, or server versions"
      - id: WH9
        category: dependency_vulnerabilities
        check: "Third-party dependencies checked for known CVEs; no packages with unpatched critical vulnerabilities"
      - id: WH10
        category: audit_trail
        check: "Security-relevant actions (login, permission changes, data access) are logged with timestamp and actor"
      - id: WH11
        category: csrf_defense
        check: "Anti-CSRF tokens on all state-changing forms; SameSite cookie attribute set to Lax or Strict"
