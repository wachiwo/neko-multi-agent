# ============================================================
# FALLBACK — when kashira cannot determine task type
# ============================================================
# If no profile matches, inject ALL conditional rules (safe default).
# This is the current behavior — no rules are lost.

fallback: inject_all

# ============================================================
# PROFILE SELECTION GUIDE (for kashira)
# ============================================================
# 1. Determine primary task type from description/action
# 2. Select primary profile (one of the 7 above)
# 3. Check if task has modifier conditions:
#    - Reassigned fix? → add fix_task profile
#    - 5+ files? → add batch_task profile
#    - CSS/HTML output? → add css_task profile
#    - New config files? → add flat_config rule
# 4. Auto-inject rules fire automatically from task YAML fields
# 5. Combine all rule sets (deduplicate)
# 6. Write inject_rules list to task YAML
