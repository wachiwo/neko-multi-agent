# Conditional Rule Injection Profiles
# Kashira selects profile(s) based on task type, then injects matching rules into task YAML.
# Workers read ONLY core _worker_base.md (KEEP rules) + injected conditional rules.
#
# Source: outputs/cmd_153/rule_audit.md (worker3 audit, 2026-03-06)
# Maintained by: kashira (updates when rules are added/moved)

# ============================================================
# PROFILES — kashira picks one primary + optional modifiers
# ============================================================
# Multiple profiles can be combined (additive).
# Example: batch CSS fix = [css_task, batch_task, fix_task]

profiles:
  css_task:
    description: "CSS/HTML styling work"
    rules:
      - css_scope
      - visual_disclaimer

  cross_review:
    description: "Code review tasks (type: cross_review)"
    rules:
      - cross_review_role

  security_review:
    description: "Security review tasks (type: security_review)"
    rules:
      - security_review_role
      - cross_review_role

  implementation:
    description: "Code/script creation, new features"
    rules:
      - large_file
      - naming_convention

  fix_task:
    description: "Bug fix tasks (especially reassigned with prior_attempts)"
    rules:
      - fix_prior_attempts
      - hypothesis_challenge

  batch_task:
    description: "5+ file identical transformations"
    rules:
      - batch_protocol
      - large_file

  consultation:
    description: "Analysis, research, opinion, lightweight tasks"
    rules: []

# ============================================================
# AUTO-INJECT — triggered by task YAML fields, not profiles
# ============================================================
# Kashira applies these automatically based on task field values.
# No manual profile selection needed for these.

auto_inject:
  - trigger_field: priority
    trigger_value: "high"
    rules:
      - verification_evidence

  - trigger_field: p2p_review
    trigger_value: true
    rules:
      - p2p_communication

  - trigger_field: heads_up
    trigger_value: true
    rules:
      - p2p_communication

  - trigger_field: type
    trigger_value: "cross_review"
    rules:
      - cross_review_role

  - trigger_field: type
    trigger_value: "security_review"
    rules:
      - security_review_role
      - cross_review_role

